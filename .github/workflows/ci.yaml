name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: find . -name '*.sh' -exec shellcheck -x -S warning --exclude=SC1083 {} +

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  validate:
    name: BDFS Incus Profile Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate BDFS Incus profile YAML and required settings
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import YAML from 'yaml';

          const profile = YAML.parse(readFileSync('ci/incus-profile-bdfs.yaml', 'utf8'));
          const required = [
            ['name', 'bdfs-privileged'],
            ['config', 'security.privileged', 'true'],
            ['config', 'security.nesting', 'true'],
            ['devices.dev.type', 'disk'],
            ['devices.dev.source', '/dev'],
            ['devices.dev.path', '/dev'],
            ['devices.fuse.type', 'unix-char'],
            ['devices.fuse.source', '/dev/fuse'],
            ['devices.fuse.path', '/dev/fuse'],
          ];

          for (const [section, path, expected] of required) {
            const actual = section === 'config'
              ? profile.config?.[path]
              : path.split('.').reduce((value, key) => value?.[key], profile);
            if (actual !== expected) {
              console.error(`Invalid BDFS Incus profile: ${path} expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
              process.exitCode = 1;
            }
          }
          NODE
